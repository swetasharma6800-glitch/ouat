        const parseMarkdown = (markdown) => {
            const lines = markdown.split('\n');
            const sections = [];
            let currentSection = null, currentSubSection = null, currentTable = null;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed || trimmed === '---') { if (currentTable) currentTable = null; return; }
                if (trimmed.startsWith('## ')) {
                    currentSection = { title: trimmed.replace('## ', ''), items: [] };
                    currentSubSection = null; currentTable = null;
                    sections.push(currentSection);
                } else if (trimmed.startsWith('### ')) {
                    currentSubSection = trimmed.replace('### ', ''); currentTable = null;
                } else if (/^\d+\./.test(trimmed)) {
                    if (currentSection) {
                        const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                        if (match) currentSection.items.push({ type: 'point', id: match[1], text: match[2], subSection: currentSubSection });
                    }
                } else if (trimmed.startsWith('|')) {
                    if (/^\|[-:| ]+\|$/.test(trimmed)) return;
                    if (!currentTable) {
                        currentTable = { type: 'table', title: currentSubSection, headers: [], rows: [] };
                        if (currentSection) currentSection.items.push(currentTable);
                    }
                    const cols = trimmed.split('|').map(c => c.trim()).filter((_, i, arr) => i !== 0 && i !== arr.length - 1);
                    if (currentTable.headers.length === 0) currentTable.headers = cols;
                    else currentTable.rows.push(cols);
                }
            });
            return sections;
        };

                            <path d='M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z'/>
                            <line x1='12' y1='9' x2='12' y2='13'/>
                            <line x1='12' y1='17' x2='12.01' y2='17'/>
                        </svg>
                    </div>
                    <h2 style="font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-bottom: 0.5rem;">Session Terminated</h2>
                    <p style="color: #64748b; font-size: 0.875rem; margin-bottom: 0.5rem; line-height: 1.6;">
                        Your account was signed in from another device or location.
                    </p>
                    <p style="
                        background: #fef2f2; border: 1px solid #fecaca; border-radius: 0.5rem;
                        padding: 0.5rem 0.75rem; font-size: 0.75rem; color: #b91c1c;
                        margin-bottom: 1.25rem; font-family: monospace; letter-spacing: 0.05em;
                    ">IP: ${ip}</p>
                    <p style="color: #94a3b8; font-size: 0.75rem; margin-bottom: 1.5rem;">
                        Only one active session is allowed per account. Please sign in again if this was you.
                    </p>
                    <button id="kickedReloginBtn" style="
                        width: 100%; padding: 0.65rem 1rem;
                        background: #059669; color: white;
                        border: none; border-radius: 0.75rem;
                        font-weight: 600; font-size: 0.875rem; cursor: pointer;
                        transition: background 0.2s;
                    " onmouseover="this.style.background='#047857'" onmouseout="this.style.background='#059669'">Sign In Again</button>
                </div>
            `;
            document.body.appendChild(modal);
            document.getElementById('kickedReloginBtn').addEventListener('click', () => {
                modal.remove();
            });
        };

        // Starts watching Firestore for session changes (detects another login)
        const startSessionWatcher = (user, myToken) => {
            if (sessionWatcher) sessionWatcher(); // Unsubscribe previous watcher
            const userDocRef = doc(db, 'users', user.uid);
            sessionWatcher = onSnapshot(userDocRef, (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();
                // If the stored token no longer matches this tab's token → another login happened
                if (data.sessionToken && data.sessionToken !== myToken) {
                    const otherIP = data.sessionIP || 'unknown';
                    // Stop watching
                    if (sessionWatcher) { sessionWatcher(); sessionWatcher = null; }
                    // Force sign out silently
                    signOut(auth).then(() => {
                        loginEmail.value = '';
                        loginPassword.value = '';
                        submitLoginBtn.innerHTML = '<span>Sign In</span><i data-lucide="arrow-right" class="w-4 h-4"></i>';
                        lucide.createIcons({ root: submitLoginBtn });
                        submitLoginBtn.disabled = false;
                        showKickedOutModal(otherIP);
                    });
                }
            });
        };

        // Handle Login Auth State
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                loginOverlay.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => loginOverlay.classList.add('hidden'), 300);
                logoutBtn.classList.remove('hidden');

                // Load user data from Firestore
                const userDocRef = doc(db, 'users', user.uid);
                try {
                    const docSnap = await getDoc(userDocRef);
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        masteredIds = new Set(data.masteredIds || []);
                        mockScores = data.mockScores || [];
                    } else {
                        // Create new record for this user if it doesn't exist
                        await setDoc(userDocRef, { masteredIds: [], mockScores: [] });
                    }

                    // --- CONCURRENT SESSION: stamp this session's token ---
                    // Only write the token if one wasn't written during the login button click
                    // (activeSessionToken is set before signIn resolves; onAuthStateChanged fires after)
                    if (activeSessionToken) {
                        startSessionWatcher(user, activeSessionToken);
                    }
                } catch(e) {
                    console.error("Error fetching user data:", e);
                }

                initApp(); // Start rendering app with user data
            } else {
                currentUser = null;
                activeSessionToken = null;
                if (sessionWatcher) { sessionWatcher(); sessionWatcher = null; }
                loginOverlay.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
                logoutBtn.classList.add('hidden');
                masteredIds.clear(); // Reset state locally
            }
        });

        // Submit Login Form
        submitLoginBtn.addEventListener('click', async () => {
            loginError.classList.add('hidden');
            const email = loginEmail.value.trim();
            const pass = loginPassword.value;
            
            if(!email || !pass) {
                loginError.textContent = "Please enter both email and password.";
                loginError.classList.remove('hidden');
                return;
            }

            submitLoginBtn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Signing in...';
            lucide.createIcons({ root: submitLoginBtn });
            submitLoginBtn.disabled = true;

            try {
                // 1. Fetch IP before signing in
                currentUserIP = await fetchPublicIP();

                // 2. Attempt sign-in
                const credential = await signInWithEmailAndPassword(auth, email, pass);
                const uid = credential.user.uid;

                // 3. Generate & store session token in Firestore (overwrites any previous session)
                activeSessionToken = generateSessionToken();
                const userDocRef = doc(db, 'users', uid);
                await setDoc(userDocRef, {
                    sessionToken: activeSessionToken,
                    sessionIP: currentUserIP,
                    sessionAt: new Date().toISOString()
                }, { merge: true });

                // onAuthStateChanged will fire next and call startSessionWatcher
            } catch(error) {
                loginError.textContent = error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password'
                    ? "Invalid credentials. Contact administrator."
                    : "Sign-in failed. Please try again.";
                loginError.classList.remove('hidden');
                submitLoginBtn.innerHTML = '<span>Sign In</span><i data-lucide="arrow-right" class="w-4 h-4"></i>';
                lucide.createIcons({ root: submitLoginBtn });
                submitLoginBtn.disabled = false;
                activeSessionToken = null;
            }
        });

        // Sign Out
        logoutBtn.addEventListener('click', async () => {
            // Clear the session token from Firestore on voluntary logout
            if (currentUser) {
                try {
                    const userDocRef = doc(db, 'users', currentUser.uid);
                    await updateDoc(userDocRef, { sessionToken: null, sessionIP: null });
                } catch(e) { /* ignore */ }
            }
            if (sessionWatcher) { sessionWatcher(); sessionWatcher = null; }
            signOut(auth).then(() => {
                loginEmail.value = '';
                loginPassword.value = '';
                submitLoginBtn.innerHTML = '<span>Sign In</span><i data-lucide="arrow-right" class="w-4 h-4"></i>';
                lucide.createIcons({ root: submitLoginBtn });
                submitLoginBtn.disabled = false;
            });
        });

        // ==========================================
        // 5. APPLICATION LOGIC
        // ==========================================
        const initApp = () => {
            pointsData = parseMarkdown(RAW_CONTENT);
            renderSidebar();
            renderMainContent();
            updateProgress();

            // Search Handlers
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                clearSearchBtn.classList.toggle('hidden', searchQuery.length === 0);
                if(currentMode === 'points') renderSidebar(); 
                renderMainContent();
            });

            clearSearchBtn.addEventListener('click', () => {
                searchQuery = ''; searchInput.value = '';
                clearSearchBtn.classList.add('hidden');
                if(currentMode === 'points') renderSidebar();
                renderMainContent();
            });

            mobileMenuBtn.addEventListener('click', toggleSidebar);
            sidebarOverlay.addEventListener('click', toggleSidebar);

            mainContent.addEventListener('scroll', () => {
                if (mainContent.scrollTop > 300) {
                    backToTopBtn.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
                    backToTopBtn.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
                } else {
                    backToTopBtn.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
                    backToTopBtn.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
                }
            });
            backToTopBtn.addEventListener('click', () => mainContent.scrollTo({ top: 0, behavior: 'smooth' }));

            // Swipe
            let touchStartX = 0, touchEndX = 0;
            document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
            document.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                if (sidebarOpen && touchStartX - touchEndX > 50) toggleSidebar();
                if (!sidebarOpen && touchEndX - touchStartX > 75 && touchStartX < 30) toggleSidebar();
            }, {passive: true});

            // Event Delegation (Click interactions)
            mainContent.addEventListener('click', (e) => {
                const pointCard = e.target.closest('.point-card');
                if (pointCard && currentMode === 'points') toggleMasteredPoint(pointCard.dataset.id, pointCard);
                
                const qaCard = e.target.closest('.qa-card');
                if (qaCard && currentMode === 'qa') {
                    const id = qaCard.dataset.id;
                    qaRevealed[id] = !qaRevealed[id];
                    renderMainContent();
                }

                const revealAllBtn = e.target.closest('#qaRevealAllBtn');
                if (revealAllBtn && currentMode === 'qa') {
                    qaRevealAll = !qaRevealAll;
                    renderMainContent();
                }

                const weightageHeader = e.target.closest('.weightage-header');
                if (weightageHeader && currentMode === 'weightage') {
                    const rank = Number(weightageHeader.dataset.rank);
                    expandedWeightageRank = (expandedWeightageRank === rank) ? null : rank;
                    renderMainContent();
                }
            });

            // Event Delegation (Select interactions)
            mainContent.addEventListener('change', (e) => {
                if (e.target.id === 'qaYearFilter') { qaYearFilter = e.target.value === 'All' ? 'All' : Number(e.target.value); renderMainContent(); }
                if (e.target.id === 'qaTopicFilter') { qaTopicFilter = e.target.value; renderMainContent(); }
            });
        };

        const toggleMasteredPoint = async (id, cardElement) => {
            if (masteredIds.has(id)) {
                masteredIds.delete(id);
                cardElement.classList.remove('bg-slate-50/50', 'dark:bg-slate-800/30', 'opacity-60');
                cardElement.classList.add('bg-white', 'dark:bg-slate-800', 'shadow-sm', 'hover:shadow-md', 'hover:border-emerald-300', 'dark:hover:border-emerald-600');
                cardElement.querySelector('button').innerHTML = '<i data-lucide="circle" class="w-[22px] h-[22px]"></i>';
            } else {
                masteredIds.add(id);
                cardElement.classList.add('bg-slate-50/50', 'dark:bg-slate-800/30', 'opacity-60');
                cardElement.classList.remove('bg-white', 'dark:bg-slate-800', 'shadow-sm', 'hover:shadow-md', 'hover:border-emerald-300', 'dark:hover:border-emerald-600');
                cardElement.querySelector('button').innerHTML = '<i data-lucide="check-circle-2" class="w-[22px] h-[22px] text-emerald-500"></i>';
            }
            lucide.createIcons({ nameAttr: 'data-lucide', root: cardElement.querySelector('button') });
            updateProgress();

            // SAVE to Firestore
            if (currentUser) {
                const userDocRef = doc(db, 'users', currentUser.uid);
                try {
                    await setDoc(userDocRef, { masteredIds: Array.from(masteredIds) }, { merge: true });
                } catch(e) {
                    console.error("Failed to save progress to cloud:", e);
                }
            }
        };

        const updateProgress = () => {
            masteryCountEl.textContent = masteredIds.size;
            const percentage = pointsData.length > 0 ? Math.round((masteredIds.size / 500) * 100) : 0;
            progressBar.style.width = `${percentage}%`;
        };

        const toggleSidebar = () => {
            sidebarOpen = !sidebarOpen;
            if (sidebarOpen) {
                sidebar.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            }
        };

        // Attach modes to window object to work with inline onClick inside module script
        window.setMode = (mode) => {
            currentMode = mode;
            searchQuery = ''; searchInput.value = ''; clearSearchBtn.classList.add('hidden');
            
            if (currentMode === 'points') {
                masteryWidget.classList.remove('hidden', 'md:hidden'); masteryWidget.classList.add('md:flex');
                progressBarContainer.classList.remove('hidden');
            } else {
                masteryWidget.classList.add('hidden'); masteryWidget.classList.remove('md:flex');
                progressBarContainer.classList.add('hidden');
            }

            if (currentMode === 'mock') {
                if (window.innerWidth < 768) toggleSidebar();
                renderSidebar(); renderMockHomeMode(); mainContent.scrollTo(0,0);
                return;
            }

            if (window.innerWidth < 768) toggleSidebar();
            renderSidebar(); renderMainContent(); mainContent.scrollTo(0,0);
        };

        window.setActiveSection = (idx) => {
            activeSectionIdx = idx;
            setMode('points');
        };

        const renderSidebar = () => {
            const MODES = [
                { id: 'progress', label: 'My Progress', icon: 'trending-up' },
                { id: 'points', label: '500 Points', icon: 'book-open' },
                { id: 'qa', label: 'Q&A Bank', icon: 'help-circle' },
                { id: 'notes', label: 'Short Notes', icon: 'file-text' },
                { id: 'weightage', label: 'Topic Weightage', icon: 'bar-chart-2' },
                { id: 'mock', label: 'Mock Tests', icon: 'clipboard-list' }
            ];

            modesNav.innerHTML = MODES.map(m => `
                <button onclick="setMode('${m.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left text-sm transition-colors duration-150 ${currentMode === m.id ? 'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-800 dark:text-emerald-300 font-medium' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50'}">
                    <i data-lucide="${m.icon}" class="w-[18px] h-[18px] opacity-80"></i><span>${m.label}</span>
                </button>
            `).join('');

            sectionsContainer.classList.toggle('hidden', currentMode !== 'points');
            if (currentMode === 'points') {
                sidebarNav.innerHTML = pointsData.map((section, idx) => `
                    <button onclick="setActiveSection(${idx})" class="w-full flex items-start gap-3 px-3 py-2.5 rounded-lg text-left text-sm transition-colors duration-150 ${(activeSectionIdx === idx && !searchQuery) ? 'bg-emerald-50 dark:bg-emerald-900/20 text-emerald-700 dark:text-emerald-400 font-medium border border-emerald-100 dark:border-emerald-800/50' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 border border-transparent'}">
                        <span class="mt-0.5 opacity-80"><i data-lucide="${getSectionIconName(section.title)}" class="w-[16px] h-[16px]"></i></span>
                        <span class="leading-snug">${section.title.replace('SECTION ', '')}</span>
                    </button>
                `).join('');
            }
            lucide.createIcons({ root: sidebar });
        };

        const renderMainContent = () => {
            if (currentMode === 'points') renderPointsMode();
            else if (currentMode === 'qa') renderQAMode();
            else if (currentMode === 'notes') renderNotesMode();
            else if (currentMode === 'weightage') renderWeightageMode();
            else if (currentMode === 'mock') renderMockHomeMode();
            else if (currentMode === 'progress') renderProgressMode();
            lucide.createIcons({ root: mainContent });
        };

        const renderPointsMode = () => {
            let displayedContent = [];
            if (!searchQuery.trim()) { displayedContent = pointsData[activeSectionIdx] ? [pointsData[activeSectionIdx]] : []; } 
            else {
                const query = searchQuery.toLowerCase();
                pointsData.forEach(section => {
                    const matchedItems = section.items.filter(item => {
                        if (item.type === 'point') return item.text.toLowerCase().includes(query);
                        if (item.type === 'table') return item.rows.some(row => row.some(cell => cell.toLowerCase().includes(query)));
                        return false;
                    });
                    if (matchedItems.length > 0) displayedContent.push({ ...section, items: matchedItems });
                });
            }

            if (searchQuery && displayedContent.length === 0) {
                mainContent.innerHTML = `<div class="flex flex-col items-center justify-center h-64 text-slate-400"><i data-lucide="search" class="w-12 h-12 mb-4 opacity-20"></i><p>No results found</p></div>`; return;
            }

            let html = '<div class="max-w-4xl mx-auto space-y-12 fade-in">';
            if (searchQuery) html += `<h2 class="text-xl font-semibold mb-6 flex items-center gap-2"><i data-lucide="search" class="w-5 h-5 text-emerald-500"></i>Search Results</h2>`;

            displayedContent.forEach(section => {
                const groupedItems = section.items.reduce((acc, item) => { const sub = item.subSection || 'General'; if (!acc[sub]) acc[sub] = []; acc[sub].push(item); return acc; }, {});
                html += `<section class="mb-12">`;
                if (!searchQuery) html += `<div class="mb-8 border-b-2 border-emerald-500/20 pb-4"><h1 class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white flex items-center gap-3"><span class="bg-emerald-100 dark:bg-emerald-900/50 text-emerald-600 dark:text-emerald-400 p-2 rounded-lg"><i data-lucide="${getSectionIconName(section.title)}" class="w-6 h-6"></i></span>${section.title}</h1></div>`;
                html += `<div class="space-y-8">`;
                for (const [subTitle, items] of Object.entries(groupedItems)) {
                    html += `<div class="space-y-4">`;
                    if (subTitle !== 'General') html += `<h3 class="text-lg font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-2 mt-6"><div class="h-4 w-1 bg-emerald-500 rounded-full"></div>${subTitle}</h3>`;
                    html += `<div class="grid grid-cols-1 gap-3">`;

                    items.forEach(item => {
                        if (item.type === 'point') {
                            const isMastered = masteredIds.has(item.id);
                            const cardClasses = isMastered ? 'bg-slate-50/50 dark:bg-slate-800/30 border-slate-200 dark:border-slate-700 opacity-60' : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md hover:border-emerald-300 dark:hover:border-emerald-600';
                            const iconHtml = isMastered ? `<i data-lucide="check-circle-2" class="w-[22px] h-[22px] text-emerald-500"></i>` : `<i data-lucide="circle" class="w-[22px] h-[22px]"></i>`;
                            const sectionBadge = searchQuery ? `<span class="text-xs text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded-full">${section.title.replace('SECTION ', '').split(':')[0]}</span>` : '';
                            html += `
                                <div data-id="${item.id}" class="point-card group relative flex items-start gap-3 sm:gap-4 p-3 sm:p-4 rounded-xl border cursor-pointer transition-all duration-200 ease-in-out ${cardClasses} active:scale-[0.98] touch-manipulation">
                                    <button class="mt-0.5 flex-shrink-0 text-slate-400 group-hover:text-emerald-500 transition-colors focus:outline-none pointer-events-none">${iconHtml}</button>
                                    <div class="flex-1">
                                        <div class="flex items-center gap-2 mb-1"><span class="text-xs font-bold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/30 px-2 py-0.5 rounded-full border border-emerald-100 dark:border-emerald-800">#${item.id}</span>${sectionBadge}</div>
                                        <p class="text-slate-800 dark:text-slate-200 leading-relaxed text-sm sm:text-base">${formatText(item.text)}</p>
                                    </div>
                                </div>
                            `;
                        } else if (item.type === 'table') {
                            html += `
                                <div class="overflow-x-auto my-6 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                    <table class="w-full text-sm text-left"><thead class="text-xs uppercase bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300"><tr>
                                        ${item.headers.map(h => `<th class="px-6 py-4 font-bold tracking-wider">${h}</th>`).join('')}
                                    </tr></thead><tbody>
                                        ${item.rows.map(row => `<tr class="bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                                            ${row.map(cell => `<td class="px-6 py-4">${formatText(cell)}</td>`).join('')}
                                        </tr>`).join('')}
                                    </tbody></table>
                                </div>
                            `;
                        }
                    });
                    html += `</div></div>`;
                }
                html += `</div></section>`;
            });
            html += `<div class="h-16"></div></div>`;
            mainContent.innerHTML = html;
        };

        const renderQAMode = () => {
            const yearBadgeColor = { 2018:"#D85A30", 2019:"#1D9E75", 2020:"#E8850C", 2021:"#7F77DD", 2022:"#D4537E", 2023:"#378ADD", 2024:"#639922" };
            const filteredQA = QA_DATA.filter(q => {
                const yOk = qaYearFilter === 'All' || q.year === qaYearFilter;
                const tOk = qaTopicFilter === 'All' || q.topic === qaTopicFilter;
                const sOk = !searchQuery || q.q.toLowerCase().includes(searchQuery.toLowerCase()) || q.a.toLowerCase().includes(searchQuery.toLowerCase());
                return yOk && tOk && sOk;
            });

            let html = `<div class="max-w-4xl mx-auto fade-in">
                <div class="mb-6 border-b-2 border-emerald-500/20 pb-4"><h1 class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white flex items-center gap-3"><span class="bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 p-2 rounded-lg"><i data-lucide="help-circle" class="w-6 h-6"></i></span>Q&A Bank</h1></div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                    <select id="qaYearFilter" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 rounded-lg py-2 px-3 focus:outline-none focus:ring-2 focus:ring-emerald-500">${QA_YEARS.map(y => `<option value="${y}" ${qaYearFilter == y ? 'selected' : ''}>${y === 'All' ? 'All Years' : y}</option>`).join('')}</select>
                    <select id="qaTopicFilter" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 rounded-lg py-2 px-3 focus:outline-none focus:ring-2 focus:ring-emerald-500">${QA_TOPICS.map(t => `<option value="${t}" ${qaTopicFilter === t ? 'selected' : ''}>${t === 'All' ? 'All Topics' : t}</option>`).join('')}</select>
                </div>
                <div class="flex items-center justify-between mb-4"><span class="text-sm text-slate-500 dark:text-slate-400 font-medium">${filteredQA.length} questions found</span><button id="qaRevealAllBtn" class="text-sm px-3 py-1.5 rounded-md border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 transition font-medium">${qaRevealAll ? "Hide All Answers" : "Reveal All Answers"}</button></div>
                <div class="space-y-3">`;

            if (filteredQA.length === 0) html += `<div class="text-center text-slate-500 py-12 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">No questions match your current filters.</div>`;
            else {
                filteredQA.forEach(item => {
                    const show = qaRevealAll || qaRevealed[item.id];
                    const color = yearBadgeColor[item.year];
                    html += `
                        <div data-id="${item.id}" class="qa-card bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-4 cursor-pointer hover:shadow-md transition-shadow">
                            <div class="flex items-start gap-3">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded flex-shrink-0 mt-0.5" style="background:${color}22; color:${color}; border:0.5px solid ${color}55;">${item.year}</span>
                                <div class="flex-1"><span class="text-sm sm:text-base text-slate-800 dark:text-slate-200 leading-snug font-medium">${formatText(item.q)}</span><div class="text-[11px] text-slate-400 dark:text-slate-500 mt-1 uppercase tracking-wide font-semibold">${item.topic}</div></div>

            const chosen = mockAnswers[mockQIdx];
            const isFlagged = mockFlagged[mockQIdx];
            const attempted = Object.keys(mockAnswers).length;
            const flaggedCnt = Object.values(mockFlagged).filter(Boolean).length;

            // Update progress bar
            mockProgressBar.style.width = `${((mockQIdx + 1) / mockTest.questions.length) * 100}%`;
            mockProgressBar.style.backgroundColor = mockTest.color;

            // Update palette
            mockPaletteGrid.innerHTML = mockTest.questions.map((qst, idx) => {
                const hasAnswer = mockAnswers[idx] !== undefined;
                const current = idx === mockQIdx;
                const isFlag = mockFlagged[idx];
                let cellBg = 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-slate-700';
                if (hasAnswer) cellBg = 'bg-emerald-50 dark:bg-emerald-950 border-emerald-200 dark:border-emerald-800 text-emerald-600 dark:text-emerald-400';
                if (isFlag) cellBg = 'bg-amber-50 dark:bg-amber-950 border-amber-200 dark:border-amber-800 text-amber-600 dark:text-amber-400';
                if (current) cellBg += ' ring-2 ring-emerald-500 dark:ring-emerald-400 scale-110 z-10';
                return `<button onclick="window.mockJumpTo(${idx})" class="py-1.5 rounded-lg text-xs font-bold border transition ${cellBg}">${idx + 1}</button>`;
            }).join('');

            // Main question content
            mockContent.innerHTML = `
                <div class="max-w-3xl mx-auto">
                    <!-- Progress Info -->
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-5 px-1">
                        <div class="flex items-center gap-3 flex-1 min-w-[200px]">
                            <span class="text-xs font-bold text-slate-500 dark:text-slate-400">Question ${mockQIdx + 1} of ${mockTest.questions.length}</span>
                        </div>
                        <div class="flex items-center gap-3 text-xs font-medium text-slate-500 dark:text-slate-400">
                            <span>Attempted: <strong class="text-slate-800 dark:text-slate-200">${attempted}</strong>/${mockTest.questions.length}</span>
                            ${flaggedCnt > 0 ? `<span class="flex items-center gap-1 text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-950 px-2 py-0.5 rounded border border-amber-200 dark:border-amber-800">🚩 ${flaggedCnt} flagged</span>` : ''}
                        </div>
                    </div>

                    <!-- Question Card -->
                    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-5 sm:p-7 shadow-sm">
                        <!-- Question Header -->
                        <div class="flex items-center justify-between gap-3 mb-5 pb-4 border-b border-slate-100 dark:border-slate-700">
                            <div class="flex items-center gap-2">
                                <span class="px-2.5 py-1 rounded-lg text-[10px] font-extrabold uppercase tracking-widest border" style="border-color:${DIFF_COLOR[q.diff]}40; color:${DIFF_COLOR[q.diff]}; background:${DIFF_COLOR[q.diff]}12;">${q.diff}</span>
                                <span class="px-2.5 py-1 bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 rounded-lg text-[10px] font-bold uppercase tracking-wider">${q.topic}</span>
                            </div>
                            <button onclick="window.mockToggleFlag()" class="flex items-center gap-1.5 px-3 py-1 rounded-xl text-xs font-bold transition ${isFlagged ? 'bg-amber-50 dark:bg-amber-950 text-amber-600 dark:text-amber-400 border border-amber-200 dark:border-amber-800' : 'bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700'}">
                                🚩 ${isFlagged ? 'Flagged' : 'Flag'}
                            </button>
                        </div>

                        <!-- Question Text -->
                        <div class="text-slate-800 dark:text-slate-100 font-semibold text-base leading-relaxed mb-6">
                            <span class="text-indigo-600 dark:text-indigo-400 font-black mr-1 text-sm bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800 px-2 py-0.5 rounded-lg">Q${mockQIdx + 1}</span>
                            ${q.q}
                        </div>

                        <!-- Options -->
                        <div class="flex flex-col gap-3">
                            ${q.opts.map((opt, idx) => {
                                const isSelected = chosen === idx;
                                let optStyle = 'bg-slate-50 dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300';
                                if (isSelected) {
                                    optStyle = 'bg-indigo-50 dark:bg-indigo-950/60 border-indigo-400 dark:border-indigo-500 text-indigo-700 dark:text-indigo-300 shadow-sm ring-1 ring-indigo-200 dark:ring-indigo-800';
                                }
                                return `<button onclick="window.mockAnswer(${idx})" class="w-full text-left p-3.5 rounded-xl border text-sm font-medium transition duration-200 hover:-translate-y-0.5 flex items-start gap-3 ${optStyle}">
                                    <span class="w-6 h-6 rounded-lg text-xs font-bold flex items-center justify-center flex-shrink-0 transition ${isSelected ? 'bg-indigo-500 text-white' : 'bg-slate-200 dark:bg-slate-800 text-slate-500 dark:text-slate-400'}">${String.fromCharCode(65 + idx)}</span>
                                    <span class="flex-1 leading-relaxed mt-0.5">${opt}</span>
                                </button>`;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Navigation -->
                    <div class="flex items-center justify-between gap-4 mt-5">
                        <button onclick="window.mockPrev()" ${mockQIdx === 0 ? 'disabled' : ''} class="flex-1 py-3 px-5 bg-white dark:bg-slate-800 disabled:opacity-30 disabled:pointer-events-none hover:bg-slate-50 dark:hover:bg-slate-750 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-bold transition active:scale-95">
                            ← Previous
                        </button>
                        ${mockQIdx < mockTest.questions.length - 1 ? `
                            <button onclick="window.mockNext()" class="flex-1 py-3 px-5 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-750 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-bold transition active:scale-95">
                                Next →
                            </button>
                        ` : `
                            <button onclick="window.handleMockSubmit()" class="flex-1 py-3 px-5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-extrabold tracking-wide shadow-md transition active:scale-95">
                                Submit Paper
                            </button>
                        `}
                    </div>
                </div>`;
        };

        // -- RENDER RESULTS --
        const renderMockResults = () => {
            if (!mockTest) return;
            const sc = mockScore();
            const pc = mockPct();
            const { g, c, msg } = mockGrade(pc);
            const stats = mockTopicStats();
            const filtered = mockFilteredQs();
            const attempted = Object.keys(mockAnswers).length;
            const skipped = mockTest.questions.length - attempted;
            const wrong = attempted - sc;

            // Hide header, show results
            mockHeader.classList.add('hidden');
            mockPalette.classList.add('hidden');

            const filterBtns = ['all', 'correct', 'wrong', 'skipped'];
            const filterLabels = { all: `All (${mockTest.questions.length})`, correct: `✓ Correct (${sc})`, wrong: `✗ Wrong (${wrong})`, skipped: `○ Skipped (${skipped})` };
            const filterColors = { all: 'slate', correct: 'emerald', wrong: 'red', skipped: 'amber' };

            mockContent.innerHTML = `
                <div class="max-w-4xl mx-auto fade-in">
                    <!-- Top Actions -->
                    <div class="flex items-center justify-between gap-3 mb-6">
                        <button onclick="window.exitMockTest()" class="px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-750 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-bold transition flex items-center gap-2">
                            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Tests Menu
                        </button>
                        <button onclick="window.startMockTest(${mockTest.id})" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-2">
                            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Retry Paper
                        </button>
                    </div>

                    <!-- Score Card -->
                    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 sm:p-8 mb-6 shadow-sm text-center">
                        <div class="text-sm font-bold text-slate-500 dark:text-slate-400 mb-2 uppercase tracking-wider">${mockTest.title} — Results</div>
                        <div class="text-7xl sm:text-8xl font-black mb-2" style="color:${c}">${g}</div>
                        <div class="text-lg font-bold text-slate-700 dark:text-slate-200 mb-1">${msg}</div>
                        <div class="text-3xl font-black text-slate-800 dark:text-slate-100 mt-4">${sc}/${mockTest.questions.length} <span class="text-lg font-medium text-slate-400">(${pc}%)</span></div>

                        <!-- Stats Row -->
                        <div class="grid grid-cols-3 gap-3 mt-6 max-w-md mx-auto">
                            <div class="bg-emerald-50 dark:bg-emerald-950 border border-emerald-200 dark:border-emerald-800 rounded-xl p-3">
                                <div class="text-xl font-black text-emerald-600 dark:text-emerald-400">${sc}</div>
                                <div class="text-[10px] font-bold text-emerald-500 uppercase">Correct</div>
                            </div>
                            <div class="bg-red-50 dark:bg-red-950 border border-red-200 dark:border-red-800 rounded-xl p-3">
                                <div class="text-xl font-black text-red-600 dark:text-red-400">${wrong}</div>
                                <div class="text-[10px] font-bold text-red-500 uppercase">Wrong</div>
                            </div>
                            <div class="bg-amber-50 dark:bg-amber-950 border border-amber-200 dark:border-amber-800 rounded-xl p-3">
                                <div class="text-xl font-black text-amber-600 dark:text-amber-400">${skipped}</div>
                                <div class="text-[10px] font-bold text-amber-500 uppercase">Skipped</div>
                            </div>
                        </div>
                    </div>

                    <!-- Topic Breakdown -->
                    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-5 mb-6 shadow-sm">
                        <div class="text-sm font-bold text-slate-700 dark:text-slate-200 mb-4 flex items-center gap-2">
                            <i data-lucide="pie-chart" class="w-4 h-4 text-indigo-500"></i> Topic-wise Performance
                        </div>
                        <div class="space-y-3">
                            ${Object.entries(stats).map(([topic, s]) => {
                                const topicPct = Math.round((s.correct / s.total) * 100);
                                const barColor = topicPct >= 75 ? '#10b981' : topicPct >= 50 ? '#f59e0b' : '#ef4444';
                                return `<div>
                                    <div class="flex items-center justify-between text-xs mb-1">
                                        <span class="font-semibold text-slate-700 dark:text-slate-300">${topic}</span>
                                        <span class="font-bold" style="color:${barColor}">${s.correct}/${s.total} (${topicPct}%)</span>
                                    </div>
                                    <div class="h-2 bg-slate-100 dark:bg-slate-900 rounded-full overflow-hidden">
                                        <div class="h-full rounded-full transition-all duration-500" style="width:${topicPct}%; background:${barColor}"></div>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Filter Tabs -->
                    <div class="flex flex-wrap gap-2 mb-4">
                        ${filterBtns.map(f => {
                            const active = mockFilter === f;
                            const fc = filterColors[f];
                            return `<button onclick="window.mockSetFilter('${f}')" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition ${active ? `bg-${fc}-100 dark:bg-${fc}-950 border-${fc}-300 dark:border-${fc}-700 text-${fc}-700 dark:text-${fc}-300` : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-750'}">${filterLabels[f]}</button>`;
                        }).join('')}
                    </div>

                    <!-- Question Review -->
                    <div class="space-y-4">
                        ${filtered.map(q => {
                            const userAns = mockAnswers[q.idx];
                            const isCorrect = userAns === q.ans;
                            const isSkipped = userAns === undefined;
                            const showExp = mockShowExpl[q.idx];

                            let statusColor = '#ef4444';
                            let statusText = 'Wrong';
                            let statusBg = 'bg-red-50 dark:bg-red-950 border-red-200 dark:border-red-800';
                            if (isCorrect) { statusColor = '#10b981'; statusText = 'Correct'; statusBg = 'bg-emerald-50 dark:bg-emerald-950 border-emerald-200 dark:border-emerald-800'; }
                            if (isSkipped) { statusColor = '#f59e0b'; statusText = 'Skipped'; statusBg = 'bg-amber-50 dark:bg-amber-950 border-amber-200 dark:border-amber-800'; }

                            return `<div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-4 shadow-sm">
                                <!-- Question header -->
                                <div class="flex items-center justify-between gap-2 mb-3">
                                    <div class="flex items-center gap-2">
                                        <span class="text-xs font-black px-2 py-0.5 rounded-md border" style="color:${statusColor}; background:${statusColor}12; border-color:${statusColor}30">${statusText}</span>
                                        <span class="text-[10px] font-bold px-2 py-0.5 rounded border" style="color:${DIFF_COLOR[q.diff]}; background:${DIFF_COLOR[q.diff]}12; border-color:${DIFF_COLOR[q.diff]}30">${q.diff}</span>
                                        <span class="text-[10px] font-bold text-slate-400 dark:text-slate-500 bg-slate-100 dark:bg-slate-900 px-2 py-0.5 rounded border border-slate-200 dark:border-slate-700">${q.topic}</span>
                                    </div>
                                    <span class="text-xs font-bold text-slate-400 dark:text-slate-500">Q${q.idx + 1}</span>
                                </div>

                                <!-- Question text -->
                                <div class="text-sm font-semibold text-slate-800 dark:text-slate-100 mb-3 leading-relaxed">${q.q}</div>

                                <!-- Options -->
                                <div class="space-y-2 mb-3">
                                    ${q.opts.map((opt, oIdx) => {
                                        const isAns = oIdx === q.ans;
                                        const isUserChoice = oIdx === userAns;
                                        let optClass = 'bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400';
                                        let marker = '';
                                        if (isAns) {
                                            optClass = 'bg-emerald-50 dark:bg-emerald-950 border-emerald-300 dark:border-emerald-700 text-emerald-700 dark:text-emerald-300';
                                            marker = ' ✓';
                                        }
                                        if (isUserChoice && !isCorrect) {
                                            optClass = 'bg-red-50 dark:bg-red-950 border-red-300 dark:border-red-700 text-red-600 dark:text-red-400';
                                            marker = ' ✗';
                                        }
                                        return `<div class="flex items-start gap-2 p-2.5 rounded-lg border text-xs ${optClass}">
                                            <span class="font-bold flex-shrink-0">${String.fromCharCode(65 + oIdx)}${marker}</span>
                                            <span class="leading-relaxed">${opt}</span>
                                        </div>`;
                                    }).join('')}
                                </div>

                                <!-- Explanation toggle -->
                                <button onclick="window.mockToggleExpl(${q.idx})" class="text-xs font-bold text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1">
                                    <i data-lucide="${showExp ? 'chevron-up' : 'chevron-down'}" class="w-3 h-3"></i> ${showExp ? 'Hide' : 'Show'} Explanation
                                </button>
                                ${showExp ? `<div class="mt-3 p-3 bg-indigo-50 dark:bg-indigo-950/30 border border-indigo-200 dark:border-indigo-800 rounded-lg text-xs text-indigo-700 dark:text-indigo-300 leading-relaxed">${q.exp}</div>` : ''}
                            </div>`;
                        }).join('')}
                    </div>

                    <div class="h-16"></div>
                </div>`;

            lucide.createIcons({ root: mockContent });
        };

        // -- MOCK TEST INTERACTION HANDLERS --
        window.mockAnswer = (optIdx) => {
            if (mockSubmitted) return;
            mockAnswers[mockQIdx] = optIdx;
            renderMockQuestion();
        };

        window.mockToggleFlag = () => {
            mockFlagged[mockQIdx] = !mockFlagged[mockQIdx];
            renderMockQuestion();
        };

        window.mockPrev = () => {
            if (mockQIdx > 0) { mockQIdx--; renderMockQuestion(); }
        };

        window.mockNext = () => {
            if (mockTest && mockQIdx < mockTest.questions.length - 1) { mockQIdx++; renderMockQuestion(); }
        };

        window.mockJumpTo = (idx) => {
            mockQIdx = idx;
            mockShowPalette = false;
            mockPalette.classList.add('hidden');
            renderMockQuestion();
        };

        window.mockToggleExpl = (idx) => {
            mockShowExpl[idx] = !mockShowExpl[idx];
            renderMockResults();
        };

        window.mockSetFilter = (f) => {
            mockFilter = f;
            renderMockResults();
        };

        const handleMockSubmit = async () => {
            clearInterval(mockTimerInterval);
            mockSubmitted = true;
            renderMockResults();

            // Save to Firestore
            if (currentUser && mockTest) {
                const sc = mockScore();
                const pc = mockPct();
                const { g, c } = mockGrade(pc);

                const scoreEntry = {
                    testId: mockTest.id,
                    testTitle: mockTest.title,
                    score: sc,
                    maxScore: mockTest.questions.length,
                    pct: pc,
                    grade: g,
                    color: c,
                    timestamp: new Date().toISOString()
                };

                mockScores.push(scoreEntry);

                const userDocRef = doc(db, 'users', currentUser.uid);
                try {
                    await setDoc(userDocRef, { mockScores: mockScores }, { merge: true });
                } catch(e) {
                    console.error("Failed to save mock score:", e);
                }
            }
        };
        window.handleMockSubmit = () => {
            if (confirm('Are you sure you want to submit? You cannot change answers after submission.')) {
                handleMockSubmit();
            }
        };

        window.exitMockTest = () => {
            clearInterval(mockTimerInterval);
            mockTestOverlay.classList.add('hidden');
            mockHeader.classList.add('hidden');
            mockPalette.classList.add('hidden');
            mockTest = null;
            currentMode = 'mock';
            renderSidebar();
            renderMockHomeMode();
        };

        // Wire up overlay buttons
        mockExitBtn.addEventListener('click', () => {
            if (mockSubmitted) {
                window.exitMockTest();
            } else if (confirm('Are you sure you want to exit? Your progress will be lost.')) {
                window.exitMockTest();
            }
        });

        mockGridBtn.addEventListener('click', () => {
            mockShowPalette = !mockShowPalette;
            mockPalette.classList.toggle('hidden', !mockShowPalette);
        });

        mockSubmitBtn.addEventListener('click', () => {
            window.handleMockSubmit();
        });

        // Render loading state until auth initializes
        lucide.createIcons();
    </script>
</body>
</html>
